<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Игры</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#10151c;--card:#19212b;--line:#2a3544;--tx:#eef2f6;--mut:#8a98a8;--acc:#f5b83d;--ok:#3ecf8e;--bad:#ef5b5b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 12px 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 4px}
header b{font-size:20px}
#bal{font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:11px 0;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:10px;font:inherit;font-weight:600}
nav button.on{background:var(--acc);color:#1a1405;border-color:var(--acc)}
.sec{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.sec.on{display:block}
.row{display:flex;gap:8px;margin:10px 0;align-items:center}
.row>*{flex:1}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
.btn{padding:14px;border:0;border-radius:10px;font:inherit;font-weight:700;background:var(--acc);color:#1a1405;width:100%}
.btn.g{background:var(--ok);color:#06210f}
.btn:disabled{opacity:.4}
.chip.on{border-color:var(--acc);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.chip{flex:none;padding:8px 12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:8px;font:inherit}
.big{font-size:56px;font-weight:800;text-align:center;padding:26px 0;font-variant-numeric:tabular-nums}
.big.crash{color:var(--bad)}.big.win{color:var(--ok)}
.msg{text-align:center;color:var(--mut);min-height:22px}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:24px;color:var(--tx)}
.cell.safe{background:#123524;border-color:var(--ok)}
.cell.mine{background:#3a1616;border-color:var(--bad)}
.cell.ghost{opacity:.45}
.bets{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.bets button{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-weight:600}
.bets button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.red{color:#ff6b6b}.blk{color:#c9d3df}.grn{color:var(--ok)}
#wheel{font-size:64px}
.hist{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px;min-height:26px}
.hist span{padding:2px 8px;border-radius:6px;background:var(--bg);font-size:14px;font-weight:700}
</style>
</head>
<body>
<header><b>🎮 Игры</b><span>⭐ <span id="bal">…</span></span></header>
<nav>
  <button data-t="crash" class="on">Краш</button>
  <button data-t="mines">Сапёр</button>
  <button data-t="roul">Рулетка</button>
</nav>

<!-- КРАШ -->
<section id="crash" class="sec on">
  <div class="hist" id="chist"></div>
  <div id="cm" class="big">1.00x</div>
  <div id="cmsg" class="msg">Подключаемся…</div>
  <div class="row"><input id="cbet" type="number" inputmode="numeric" min="1" value="10"><input id="cauto" type="number" step="0.1" min="1.1" placeholder="Авто-вывод x"></div>
  <div class="row" id="cchips"></div>
  <button id="cgo" class="btn" disabled>Поставить</button>
</section>

<!-- САПЁР -->
<section id="mines" class="sec">
  <div class="row"><input id="mbet" type="number" inputmode="numeric" min="1" value="10"></div>
  <div class="msg" style="text-align:left">Количество мин:</div>
  <div class="row" id="mcnt"></div>
  <div class="msg" id="mmsg">Выбери ставку и число мин</div>
  <div id="grid"></div>
  <button id="mgo" class="btn">Начать игру</button>
</section>

<!-- РУЛЕТКА -->
<section id="roul" class="sec">
  <div id="wheel" class="big">🎰</div>
  <div id="rmsg" class="msg">Выбери ставку</div>
  <div class="bets" id="rbets"></div>
  <div class="row" id="rnumrow" style="display:none"><input id="rnum" type="number" min="0" max="36" placeholder="Число 0–36"></div>
  <div class="row"><input id="rbet" type="number" inputmode="numeric" min="1" value="10"></div>
  <button id="rgo" class="btn">Крутить</button>
  <div class="hist" id="rhist"></div>
</section>

<script>
/* ============================================================
   ВПИШИ адрес своего сервера на Render (без слэша в конце), например:
   const API_URL = 'https://tg-bot-1-7bfg.onrender.com';
   Баланс, ставки и результаты игр целиком живут на сервере (server.py).
   ============================================================ */
const API_URL = '';

const tg = window.Telegram?.WebApp || {initData:'', ready(){}, expand(){}, showAlert:alert};
tg.ready(); tg.expand();
const $ = s => document.querySelector(s);

async function api(method, p = {}) {
  if (!API_URL) throw new Error('В index.html не указан API_URL');
  const r = await fetch(API_URL + '/' + method, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-Init-Data': tg.initData},
    body: JSON.stringify(p)
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Ошибка сервера');
  return j;
}
const setBal = b => $('#bal').textContent = b;
const fail = e => tg.showAlert(e.message || String(e));
const bet = id => Math.floor(+$(id).value);
const fx = n => n.toFixed(2) + 'x';

/* ---------- Вкладки ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button,.sec').forEach(e => e.classList.remove('on'));
  b.classList.add('on'); $('#' + b.dataset.t).classList.add('on');
});

/* ---------- Краш (раунды идут сами) ---------- */
['10','50','100','500'].forEach(v => {
  const c = document.createElement('button'); c.className = 'chip'; c.textContent = v;
  c.onclick = () => $('#cbet').value = v; $('#cchips').append(c);
});
let crBusy = false, crLast = null;
function crRender(s) {
  const m = s.bet, go = $('#cgo'), box = $('#cm');
  setBal(s.balance);
  $('#chist').innerHTML = s.hist.map(x => `<span class="${x < 2 ? 'red' : 'grn'}">${x.toFixed(2)}x</span>`).join('');
  box.textContent = fx(s.mult); go.className = 'btn'; go.disabled = true;
  if (s.phase === 'bet') {
    box.className = 'big';
    $('#cmsg').textContent = 'Приём ставок: ' + (s.left / 1000).toFixed(1) + ' с';
    go.textContent = m ? 'Ставка ' + m.amount + ' ⭐ принята' : 'Поставить';
    go.disabled = !!m;
  } else if (s.phase === 'fly') {
    box.className = 'big';
    if (m && m.win == null) { $('#cmsg').textContent = 'Забирай до краша!'; go.className = 'btn g'; go.textContent = 'Забрать ' + Math.floor(m.amount * s.mult) + ' ⭐'; go.disabled = false; }
    else if (m) { box.className = 'big win'; $('#cmsg').textContent = '✅ Забрано: ' + m.win + ' ⭐'; go.textContent = 'Ждём конец раунда'; }
    else { $('#cmsg').textContent = 'Раунд идёт'; go.textContent = 'Ставки со следующего раунда'; }
  } else {
    box.className = 'big crash';
    $('#cmsg').textContent = !m ? '💥 Краш' : m.win != null ? '💥 Краш. Ты выиграл ' + m.win + ' ⭐' : '💥 Краш. Ставка проиграна';
    go.textContent = 'Скоро новый раунд';
  }
}
async function crPoll() {
  if (crBusy) return; crBusy = true;
  try { crRender(crLast = await api('crash_state')); } catch (e) { $('#cmsg').textContent = 'Нет связи с сервером'; }
  crBusy = false;
}
setInterval(crPoll, 100); crPoll();
$('#cgo').onclick = async () => {
  if (!crLast) return; $('#cgo').disabled = true;
  try {
    const r = crLast.phase === 'bet'
      ? await api('crash_bet', {bet: bet('#cbet'), auto: +$('#cauto').value || null})
      : await api('crash_cashout');
    setBal(r.balance);
  } catch (e) { fail(e); }
  crPoll();
};

/* ---------- Сапёр ---------- */
let mn = null, mcount = 5;
[1,3,5,10,24].forEach(n => {
  const c = document.createElement('button'); c.className = 'chip' + (n === mcount ? ' on' : ''); c.textContent = n; c.dataset.n = n;
  c.onclick = () => { if (mn) return; setMc(n); }; $('#mcnt').append(c);
});
function setMc(n) { mcount = n; document.querySelectorAll('#mcnt .chip').forEach(c => c.classList.toggle('on', +c.dataset.n === n)); }
function mcLock(b) { $('#mcnt').style.opacity = b ? .45 : 1; $('#mcnt').style.pointerEvents = b ? 'none' : 'auto'; }
function drawGrid(mines = [], opened = new Set(), over = false) {
  const g = $('#grid'); g.innerHTML = '';
  for (let i = 0; i < 25; i++) {
    const c = document.createElement('button'); c.className = 'cell';
    if (opened.has(i)) { c.classList.add('safe'); c.textContent = '💎'; }
    else if (over && mines.includes(i)) { c.classList.add('mine', 'ghost'); c.textContent = '💣'; }
    else if (over) c.classList.add('ghost');
    c.onclick = () => mnOpen(i); g.append(c);
  }
}
function mnReset(btnText) { mn = null; $('#mgo').textContent = 'Начать игру'; $('#mgo').className = 'btn'; $('#mgo').disabled = false; mcLock(false); }
async function mnOpen(i) {
  if (!mn || mn.busy || mn.opened.has(i)) return; mn.busy = 1;
  try {
    const r = await api('mines_open', {id: mn.id, i});
    if (!r.safe) {
      mn.opened.delete(i); drawGrid(r.mines, mn.opened, true);
      const cells = $('#grid').children; cells[i].className = 'cell mine'; cells[i].textContent = '💥';
      if (r.balance != null) setBal(r.balance);
      $('#mmsg').textContent = 'Мина! Ставка проиграна'; return mnReset();
    }
    mn.opened.add(i); mn.mult = r.mult; drawGrid([], mn.opened);
    if (r.auto) { setBal(r.balance); drawGrid(r.mines, mn.opened, true); $('#mmsg').textContent = 'Максимальный множитель! +' + r.win + ' ⭐'; return mnReset(); }
    $('#mmsg').textContent = 'Множитель ' + fx(r.mult);
    $('#mgo').textContent = 'Забрать ' + Math.floor(mn.bet * r.mult) + ' ⭐'; $('#mgo').className = 'btn g';
    mn.busy = 0;
  } catch (e) { fail(e); mn && (mn.busy = 0); }
}
$('#mgo').onclick = async () => {
  try {
    if (mn) {
      if (!mn.opened.size) return fail(new Error('Сначала открой клетку'));
      const r = await api('mines_cash', {id: mn.id}); setBal(r.balance);
      drawGrid(r.mines, mn.opened, true); $('#mmsg').textContent = 'Выигрыш: ' + r.win + ' ⭐ (' + fx(r.mult) + ')'; return mnReset();
    }
    const b = bet('#mbet'), m = mcount;
    const r = await api('mines_start', {bet: b, mines: m}); setBal(r.balance);
    mn = {id: r.id, bet: b, opened: new Set(), busy: 0, mult: 1};
    mcLock(true); $('#mmsg').textContent = 'Открывай клетки'; drawGrid();
    $('#mgo').textContent = 'Забрать'; $('#mgo').className = 'btn g';
  } catch (e) { fail(e); }
};
drawGrid();
api('mines_state').then(r => {
  if (!r.active) return;
  mn = {id: r.id, bet: r.bet, opened: new Set(r.opened), busy: 0, mult: r.mult};
  setMc(r.mines); mcLock(true); drawGrid([], mn.opened);
  $('#mmsg').textContent = 'Игра продолжается';
  if (mn.opened.size) { $('#mgo').textContent = 'Забрать ' + Math.floor(mn.bet * r.mult) + ' ⭐'; $('#mgo').className = 'btn g'; }
  else { $('#mgo').textContent = 'Забрать'; $('#mgo').className = 'btn g'; }
}).catch(() => {});

/* ---------- Рулетка ---------- */
const RB = [['red','🔴 Красное x2'],['black','⚫ Чёрное x2'],['even','Чётное x2'],['odd','Нечётное x2'],['num','🎯 Число x36']];
let rtype = 'red';
RB.forEach(([k, t]) => {
  const b = document.createElement('button'); b.textContent = t; if (k === rtype) b.classList.add('on');
  if (k === 'num') b.style.gridColumn = '1 / -1';
  b.onclick = () => {
    rtype = k; document.querySelectorAll('#rbets button').forEach(x => x.classList.remove('on')); b.classList.add('on');
    $('#rnumrow').style.display = k === 'num' ? 'flex' : 'none';
  };
  $('#rbets').append(b);
});
$('#rgo').onclick = async () => {
  const btn = $('#rgo'); btn.disabled = true;
  try {
    const num = Math.floor(+$('#rnum').value);
    if (rtype === 'num' && !(num >= 0 && num <= 36)) throw new Error('Введи число от 0 до 36');
    const r = await api('roul_spin', {bet: bet('#rbet'), type: rtype, num});
    const w = $('#wheel'), t0 = Date.now();
    await new Promise(res => { const iv = setInterval(() => {
      w.textContent = Math.floor(Math.random() * 37); w.className = 'big';
      if (Date.now() - t0 > 1400) { clearInterval(iv); res(); } }, 70); });
    w.textContent = r.n; w.className = 'big ' + {r:'red',b:'blk',g:'grn'}[r.color];
    setBal(r.balance);
    $('#rmsg').textContent = r.pay ? '✅ Выигрыш: ' + r.pay + ' ⭐' : 'Не повезло';
    const h = document.createElement('span'); h.textContent = r.n; h.className = {r:'red',b:'blk',g:'grn'}[r.color];
    $('#rhist').prepend(h); while ($('#rhist').children.length > 10) $('#rhist').lastChild.remove();
  } catch (e) { fail(e); }
  btn.disabled = false;
};

api('balance').then(r => setBal(r.balance)).catch(fail);
</script>
</body>
</html>
