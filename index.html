<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OskegUp App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #17212b; color: white; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
        .screen { display: none; }
        .active { display: block; }
        
        .balance { font-size: 24px; margin: 20px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; font-size: 18px; color: white; cursor: pointer; }
        .btn-mines { background-color: #2ea6ff; }
        .btn-roulette { background-color: #ff4757; }
        .btn-cases { background-color: #ffa502; }
        .btn-back { background-color: #555; margin-bottom: 20px; padding: 10px; font-size: 14px; }

        /* Стили для Сапёра */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 300px; margin: 0 auto; }
        .cell { background-color: #2b5278; height: 60px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; user-select: none; }
        .cell.opened { background-color: #243b53; }
        .cell.mine { background-color: #ff4757; }
        .cell.star { background-color: #ffa502; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="menu-screen" class="screen active">
        <h1>Мой Магазин</h1>
        <div class="balance">Звёзды: 0 ⭐ | Тоны: 0 💎</div>
        <button class="btn btn-mines" onclick="openMines()">💣 Сапёр</button>
        <button class="btn btn-roulette">🎰 Рулетка</button>
        <button class="btn btn-cases">📦 Кейсы</button>
    </div>

    <!-- ЭКРАН 2: ИГРА САПЁР -->
    <div id="mines-screen" class="screen">
        <button class="btn btn-back" onclick="backToMenu()">← Назад в меню</button>
        <h2>Сапёр 4x4</h2>
        <p>Найди все звёзды!</p>
        <div class="grid" id="mines-grid">
            <!-- Клетки будут созданы через JS -->
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        
        let userId = tg.initDataUnsafe?.user?.id || 0;

        async function loadBalance() {
            if (!userId) return;
            try {
                let res = await fetch(/api/balance/${userId});
                let data = await res.json();
                document.querySelector('.balance').innerHTML = Звёзды: ${data.stars} ⭐ | Тоны: 0 💎;
            } catch (e) {
                console.log("Ошибка загрузки баланса", e);
            }
        }
        loadBalance();

        // Логика переключения экранов
        function openMines() {
            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('mines-screen').classList.add('active');
            generateMinesGrid();
        }

        function backToMenu() {
            document.getElementById('mines-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.add('active');
        }

        // Логика генерации поля Сапёра
        function generateMinesGrid() {
            const grid = document.getElementById('mines-grid');
            grid.innerHTML = ''; 
            
            for (let i = 0; i < 16; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerText = ''; 
                
                cell.onclick = function() {
                    if (cell.classList.contains('opened')) return; 
                    cell.classList.add('opened');
                    if (isMine) {
                        cell.classList.add('mine');
                        cell.innerText = '💣';
                        alert("Ты попал на мину! Игра окончена.");
                    } else {
                        cell.classList.add('star');
                        cell.innerText = '⭐';
                    }
                };
                grid.appendChild(cell);
            }
        }
    </script>
</body>
</html>
                    
                    let isMine = Math.random() < 0.15;
