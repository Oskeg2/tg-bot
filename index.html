<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OskegUp App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #17212b; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .balance { font-size: 24px; margin: 20px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; font-size: 18px; color: white; }
        .btn-mines { background-color: #2ea6ff; }
        .btn-roulette { background-color: #ff4757; }
        .btn-cases { background-color: #ffa502; }
    </style>
</head>
<body>
    <h1>Мой Магазин</h1>
    <div class="balance">Звёзды: 0 ⭐ | Тоны: 0 💎</div>
    
    <button class="btn btn-mines">💣 Сапёр</button>
    <button class="btn btn-roulette">🎰 Рулетка</button>
    <button class="btn btn-cases">📦 Кейсы</button>
</body>
</html>
